<!-- vocabulary/templates/vocabulary/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉语量词图鉴</title>
    <!-- 引入 Bootstrap 5（CDN，无需下载） -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .card {
            transition: transform 0.2s;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .card-title {
            font-weight: bold;
            color: #333;
        }
        .badge {
            font-size: 0.9rem;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题区 -->
        <div class="header">
            <h1>汉语量词图鉴</h1>
            <p class="lead">看形状 · 记搭配 · 学中文
        </div>

        <!-- HSK 级别卡片区 -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            {% for level in levels %}
            <div class="col">
                <div class="card h-100" onclick="window.location.href='{% url 'vocabulary:level' level.id %}'">
                    <div class="card-body">
                        <h5 class="card-title">{{ level.name }}</h5>
                        <p class="card-text">
                            {% with category_count=level.categories.count %}
                                {{ category_count }} 个分类
                            {% endwith %}

                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-primary">HSK {{ level.name }}</span>
                            <small class="text-muted">点击进入</small>
                        </div>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12">
                <div class="alert alert-warning text-center" role="alert">
                    暂无级别数据，请在后台添加 HSK 级别。
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Bootstrap JS（可选，用于交互） -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
