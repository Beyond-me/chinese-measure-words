[uwsgi]
chdir = /home/ubuntu/my_project/chinese-measure-words
module = chinese_measure_words.wsgi:application
home = /home/ubuntu/my_project/venv

# ✅ 关键：把项目根加入 Python 路径
pythonpath = /home/ubuntu/my_project/chinese-measure-words

http = 0.0.0.0:8001
processes = 4
threads = 2

logto = /home/ubuntu/my_project/chinese-measure-words/logs/uwsgi.log
pidfile = /home/ubuntu/my_project/chinese-measure-words/uwsgi.pid
vacuum = true
# ✅ 关键：让 uWSGI 直接服务静态文件
static-map = /static=/home/ubuntu/my_project/chinese-measure-words/staticfiles